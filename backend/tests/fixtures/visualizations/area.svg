<svg class="viz-chart" viewBox="0 0 640 300" role="img" aria-labelledby="area-title area-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="area-title">Область с отсутствующим наблюдением</title>
    <desc id="area-desc">Демонстрационные данные, условные единицы: 1 — 30, 2 — 60, 3 — 45, 4 — нет данных, 5 — 70, 6 — 55. Вертикальная ось от 0 до 100.</desc>
    <defs>
    <pattern id="area-grid-minor" x="50" y="30" width="20" height="20" patternUnits="userSpaceOnUse">
        <path class="viz-grid-minor" d="M0 0H20"/>
    </pattern>
    <pattern id="area-grid-major" x="50" y="30" width="100" height="100" patternUnits="userSpaceOnUse">
        <path class="viz-grid-major" d="M0 0H100"/>
    </pattern>
</defs>
<g aria-hidden="true">
    <rect x="50" y="30" width="550" height="200" fill="url(#area-grid-minor)"/>
    <rect x="50" y="30" width="550" height="200" fill="url(#area-grid-major)"/>
</g>
    <defs>

    <pattern id="area-wash" class="viz-tone-blue-gray" width="48" height="48" patternUnits="userSpaceOnUse">
        <rect width="48" height="48" class="viz-pigment"/>
        <path d="M2 7Q12 0 23 8T45 6Q49 17 37 19T16 17Q2 22 2 7Z M5 33Q18 24 27 32T43 35Q42 46 29 43T9 45Z" fill="white" opacity=".07"/>
        <path d="M4 2L13 4M32 21L44 18M8 25L17 21M23 44L36 40" class="viz-grain"/>
    </pattern>
</defs>
    <path d="M80 230V170L180 110 280 140V230Z M480 230V90L580 120V230Z" fill="url(#area-wash)"/>
    <path class="viz-ink" d="M80 170L180 110 280 140M480 90L580 120" stroke-width="1.5"/>


        <circle cx="80" cy="170" r="3" fill="var(--viz-ink)"/>
        <text class="viz-type-number" x="80" y="158" text-anchor="middle">30</text>

        <circle cx="180" cy="110" r="3" fill="var(--viz-ink)"/>
        <text class="viz-type-number" x="180" y="98" text-anchor="middle">60</text>

        <circle cx="280" cy="140" r="3" fill="var(--viz-ink)"/>
        <text class="viz-type-number" x="280" y="128" text-anchor="middle">45</text>

        <circle cx="480" cy="90" r="3" fill="var(--viz-ink)"/>
        <text class="viz-type-number" x="480" y="78" text-anchor="middle">70</text>

        <circle cx="580" cy="120" r="3" fill="var(--viz-ink)"/>
        <text class="viz-type-number" x="580" y="108" text-anchor="middle">55</text>

    <g class="viz-annotation">
    <path class="viz-ink" d="M378 65V199M373 192L378 199 383 192" aria-hidden="true"/>
    <text class="viz-type-axis" x="325" y="52">Нет данных</text>

</g>
    <path class="viz-ink" d="M50 30V230H600" stroke-width="1"/>

    <text class="viz-type-axis" x="40" y="235" text-anchor="end">0</text><text class="viz-type-axis" x="40" y="135" text-anchor="end">50</text><text class="viz-type-axis" x="40" y="35" text-anchor="end">100</text>
    <text class="viz-type-axis" x="80" y="254" text-anchor="middle">1</text><text class="viz-type-axis" x="180" y="254" text-anchor="middle">2</text><text class="viz-type-axis" x="280" y="254" text-anchor="middle">3</text><text class="viz-type-axis" x="380" y="254" text-anchor="middle">4</text><text class="viz-type-axis" x="480" y="254" text-anchor="middle">5</text><text class="viz-type-axis" x="580" y="254" text-anchor="middle">6</text>
    <text class="viz-type-axis" x="50" y="285" text-anchor="start">Пункты / условные единицы</text>
</svg>
