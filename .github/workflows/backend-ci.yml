name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -c requirements.lock

      - name: Compile Python files
        run: python -m compileall backend ../scripts

      - name: Verify backup installation script syntax
        run: bash -n ../ops/backup/install-nas-gate.sh ../ops/backup/install-backup-timer.sh

      - name: Run unit tests
        working-directory: backend
        run: pytest tests -v -k "not integration"
      - name: Verify isolated research containers
        # Avoid Docker Hub's shared unauthenticated runner pull quota. Keep the
        # existing Dockerfile base name, using the same image from its mirror.
        run: |
          docker pull mirror.gcr.io/library/python:3.11-slim
          docker tag mirror.gcr.io/library/python:3.11-slim python:3.11-slim
          pytest tests/test_research_container_integration.py -v
        env:
          RUN_DOCKER_TESTS: "1"

    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      STRAVA_VERIFY_TOKEN: test_verify_token
      STRAVA_CLIENT_ID: "12345"
      STRAVA_CLIENT_SECRET: test_client_secret
      STRAVA_REDIRECT_URI: https://example.com/strava/callback


  db-integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector@sha256:41599f76505f3a9450355e34c83a4fd215a8099ea66fcb8b38049b15da155ee7
        env:
          POSTGRES_USER: human_engine
          POSTGRES_PASSWORD: human_engine
          POSTGRES_DB: human_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U human_engine -d human_engine"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://human_engine:human_engine@127.0.0.1:5432/human_engine
      MIGRATION_ENVIRONMENT: ci
      MIGRATION_TEST_DISPOSABLE: "yes"
      FLYWAY_URL: jdbc:postgresql://127.0.0.1:5432/human_engine
      FLYWAY_USER: human_engine
      FLYWAY_PASSWORD: human_engine
      RUN_DB_TESTS: "1"
      RUN_DOCKER_TESTS: "1"
      PYTHONPATH: ${{ github.workspace }}/backend
      STRAVA_VERIFY_TOKEN: test_verify_token
      STRAVA_CLIENT_ID: "12345"
      STRAVA_CLIENT_SECRET: test_client_secret
      STRAVA_REDIRECT_URI: https://example.com/strava/callback

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -c requirements.lock

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U human_engine -d human_engine; do
            sleep 2
          done

      - name: Apply versioned DB schema
        run: python3 ../scripts/migrate.py migrate

      - name: Verify baseline catalog and historical backfill postconditions
        run: python3 ../scripts/migrate.py verify-baseline

      - name: Verify migration failure, checksum, concurrency and interruption safety
        run: python3 ../scripts/test_migrations.py

      - name: Run DB integration tests
        run: |
          docker pull mirror.gcr.io/library/python:3.11-slim
          docker tag mirror.gcr.io/library/python:3.11-slim python:3.11-slim
          pytest tests/test_metrics_smoke_integration.py -v
          pytest tests/test_pipeline_idempotency_integration.py -v
          pytest tests/test_user_profile_integration.py -v
          pytest tests/test_today_history_integration.py -v
          pytest tests/test_calibration_records_integration.py -v
          pytest tests/test_research_writer_integration.py -v

  publish-release:
    # PR code never receives registry write credentials; tests gate publication.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, db-integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/shchukins/whatte-backend
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing SHA tag
        run: |
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_SHA" >/dev/null 2>&1; then
            echo "SHA tag already exists; use its recorded digest, do not rebuild it."
            exit 1
          fi
      - name: Build and publish release
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shchukins/whatte-backend:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Smoke test published digest and production configuration
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          export WHATTE_IMAGE="$IMAGE@$DIGEST"
          docker pull "$WHATTE_IMAGE"
          test "$(docker inspect "$WHATTE_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SHA"
          docker run --rm --network none \
            -e DATABASE_URL=postgresql://test:test@localhost/test \
            -e STRAVA_VERIFY_TOKEN=test -e STRAVA_CLIENT_ID=12345 \
            -e STRAVA_CLIENT_SECRET=test -e STRAVA_REDIRECT_URI=https://example.com/callback \
            -e EXPECTED_SHA="$RELEASE_SHA" "$WHATTE_IMAGE" python -c \
            'import os; from fastapi.testclient import TestClient; from backend.app import app; import backend.worker; from backend.release import RELEASE; c=TestClient(app); assert c.get("/healthz").json()=={"ok":True}; assert c.get("/version").json()=={"git_sha":os.environ["EXPECTED_SHA"]}; assert backend.worker.RELEASE==RELEASE'
          touch .env
          POSTGRES_BIND_ADDRESS=100.64.0.1 docker compose -p human-engine -f compose.production.yaml config --format json > /tmp/whatte-compose.json
          python3 scripts/release_manifest.py --image "$WHATTE_IMAGE" --sha "$RELEASE_SHA" \
            --ci-run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --compose /tmp/whatte-compose.json --output release-manifest.json
      - name: Preserve release identity and compatibility inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: |
            release-manifest.json
            compose.production.yaml
            backend/requirements.lock
            migrations/manifest.json
          retention-days: 90
      - name: Record release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Release: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Publication only; no production deploy or issue closure." >> "$GITHUB_STEP_SUMMARY"
